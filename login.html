<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Fortics Design System · Acesso</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="js/fds-auth.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:   #0066FF;
      --navy:   #0B1121;
      --violet: #8B5CF6;
      --green:  #20D78A;
      --bg:     #060d1a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Sora', sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Background ── */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(0,102,255,.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(139,92,246,.10) 0%, transparent 60%),
        radial-gradient(circle, rgba(0,102,255,.15) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 28px 28px;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 400px;
      padding: 48px 40px 40px;
      background: rgba(11,17,33,.85);
      border: 1px solid rgba(0,102,255,.2);
      border-radius: 20px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.04),
        0 24px 80px rgba(0,0,0,.6),
        0 0 80px rgba(0,102,255,.08);
      animation: card-in .4s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(20px) scale(.97); }
      to   { opacity: 1; transform: translateY(0)    scale(1);   }
    }

    /* ── Logo ── */
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 32px;
    }
    .logo-wrap img {
      height: 28px;
      width: auto;
    }

    /* ── Heading ── */
    .heading {
      text-align: center;
      margin-bottom: 32px;
    }
    .heading h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.02em;
      margin-bottom: 6px;
    }
    .heading p {
      font-size: 13px;
      color: rgba(255,255,255,.45);
      font-weight: 400;
    }

    /* ── Form ── */
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: rgba(255,255,255,.4);
      margin-bottom: 7px;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,.05);
      border: 1.5px solid rgba(255,255,255,.1);
      border-radius: 10px;
      color: #fff;
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .field input::placeholder { color: rgba(255,255,255,.25); }
    .field input:focus {
      border-color: rgba(0,102,255,.65);
      background: rgba(0,102,255,.06);
      box-shadow: 0 0 0 3px rgba(0,102,255,.15);
    }
    .field input.error {
      border-color: rgba(255,80,80,.7);
      box-shadow: 0 0 0 3px rgba(255,80,80,.12);
    }

    /* ── Error msg ── */
    .error-msg {
      font-size: 12px;
      color: rgba(255,100,100,.9);
      text-align: center;
      min-height: 18px;
      margin-bottom: 4px;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity .2s, transform .2s;
    }
    .error-msg.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Button ── */
    .btn {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      background: linear-gradient(135deg, #0066FF 0%, #0047cc 100%);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: .01em;
      transition: opacity .15s, transform .1s, box-shadow .2s;
      box-shadow: 0 4px 24px rgba(0,102,255,.45);
    }
    .btn:hover { opacity: .9; box-shadow: 0 6px 32px rgba(0,102,255,.55); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Shake animation ── */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-8px); }
      40%     { transform: translateX(8px); }
      60%     { transform: translateX(-6px); }
      80%     { transform: translateX(6px); }
    }
    .shake { animation: shake .35s ease; }

    /* ── Footer badge ── */
    .badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 28px;
      font-size: 11px;
      color: rgba(255,255,255,.2);
      letter-spacing: .04em;
    }
    .badge::before {
      content: '✦';
      color: rgba(0,102,255,.5);
    }
  </style>
</head>
<body>

<div class="card" id="card">
  <div class="logo-wrap">
    <img src="assets/logos/horizontal-branco.svg" alt="Fortics"/>
  </div>

  <div class="heading">
    <h1>Design System</h1>
    <p>Acesso restrito à equipe Fortics</p>
  </div>

  <form id="form" autocomplete="off" novalidate>
    <div class="field">
      <label for="user">Usuário</label>
      <input id="user" type="text" placeholder="seu usuário" autocomplete="username" spellcheck="false"/>
    </div>
    <div class="field">
      <label for="pass">Senha</label>
      <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>

    <p class="error-msg" id="err">Usuário ou senha incorretos.</p>

    <button class="btn" type="submit" id="btn">Entrar</button>
  </form>

  <div class="badge">Fortics DS v1.0 · Brandbook 2026</div>
</div>

<script>
(function () {
  const form = document.getElementById('form');
  const uInp = document.getElementById('user');
  const pInp = document.getElementById('pass');
  const err  = document.getElementById('err');
  const btn  = document.getElementById('btn');
  const card = document.getElementById('card');

  function shake() {
    card.classList.remove('shake');
    void card.offsetWidth; // reflow
    card.classList.add('shake');
  }

  function showError(msg) {
    err.textContent = msg || 'Usuário ou senha incorretos.';
    err.classList.add('visible');
    uInp.classList.add('error');
    pInp.classList.add('error');
    shake();
    setTimeout(() => err.classList.remove('visible'), 3000);
  }

  function clearError() {
    err.classList.remove('visible');
    uInp.classList.remove('error');
    pInp.classList.remove('error');
  }

  uInp.addEventListener('input', clearError);
  pInp.addEventListener('input', clearError);

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const user = uInp.value;
    const pass = pInp.value;

    if (!user || !pass) {
      showError('Preencha todos os campos.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Entrando…';

    setTimeout(function () {
      if (window.FDSAuth && window.FDSAuth.login(user, pass)) {
        window.location.replace('index.html');
      } else {
        showError('Usuário ou senha incorretos.');
        btn.disabled = false;
        btn.textContent = 'Entrar';
        pInp.value = '';
        pInp.focus();
      }
    }, 400); // pequeno delay para feedback visual
  });

  // Foca no campo usuário ao carregar
  uInp.focus();
})();
</script>
</body>
</html>
